[package]
name = "parallel-downloader"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
description = "Desktop download manager with parallel ranges, resumable checkpoints and Chromium browser handoff"
license = "MIT"
repository = "https://github.com/setnic/parally"

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = { version = "0.21", default-features = false }
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(not(windows))'.dependencies]
ring = "0.17"
